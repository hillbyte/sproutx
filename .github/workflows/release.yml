name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: xkbcommon dev library
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked

      - name: package
        run: |
          cd target/release
          tar -czf sproutx-${{ github.ref_name }}-linux-x86_64.tar.gz sproutx
          mv sproutx-*.tar.gz $GITHUB_WORKSPACE/

      - uses: softprops/action-gh-release@v2
        with:
          files: sproutx-*.tar.gz