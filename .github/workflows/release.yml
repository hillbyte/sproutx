name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: xkbcommon dev libraries
        run: |
          set -e
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            # the runner's http mirrors 404 on foreign-arch indexes, so add
            # Ubuntu Ports for arm64 packages over https
            echo "deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports noble main universe" \
              | sudo tee /etc/apt/sources.list.d/arm64.list >/dev/null
          fi
          for i in 1 2 3; do
            sudo apt-get update -qq && break || sleep 5
          done
          sudo apt-get install -y -qq libxkbcommon-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y -qq libxkbcommon-dev:arm64
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        if: matrix.target == 'aarch64-unknown-linux-gnu'

      - uses: taiki-e/install-action@v2
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        with:
          tool: cargo-zigbuild

      - name: build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: build (cross aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: package
        working-directory: target/${{ matrix.target }}/release
        run: |
          tar -czf sproutx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz sproutx
          mv sproutx-*.tar.gz $GITHUB_WORKSPACE/

      - uses: softprops/action-gh-release@v2
        with:
          files: sproutx-*.tar.gz