[package]
name = "sproutx"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
description = "System-wide text expander for Linux (evdev + uinput)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hillbyte/sproutx"
homepage = "https://github.com/hillbyte/sproutx"
keywords = ["text-expander", "snippets", "uinput", "evdev", "keyboard"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4"
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
xkbcommon = { version = "0.9", default-features = false }

[profile.release]
lto = true
strip = true